[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-robinhood-lighter-arbitrage"
version = "0.1.0"
description = "Open-source two-venue perp arbitrage bot for Entropy (Hyperliquid io dex) vs Lighter / trade.xyz."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "websockets>=12.0,<18",
    "python-socks[asyncio]>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rich>=13.0,<16",
]

[project.optional-dependencies]
live = [
    "hyperliquid-python-sdk==0.24.0",
    "eth-account==0.13.7",
    # Lighter must use the verified local wheel built by scripts/build_lighter_wheel.py.
    # A portable published wheel cannot encode a checkout-relative dependency path.
    "urllib3==2.8.0",
]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
entropy-rh-arb = "entropy_robinhood_lighter_arbitrage.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["entropy_robinhood_lighter_arbitrage*"]

[tool.ruff.lint]
# BLE001: blind `except Exception` used intentionally at network boundaries
#          (exchange feeds/order paths — every failure must be caught and
#          handled locally, never crash the engine).
# S110/S112: try-except-pass used intentionally for best-effort cleanup
#            (ws close, signer client close).
# TRY203: CancelledError re-raise pattern in the status loop.
ignore = ["BLE001", "S110", "S112", "TRY004", "TRY203"]
